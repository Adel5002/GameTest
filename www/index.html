<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0920">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Страж Снов</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="cv"></canvas>

  <div id="ui">
    <!-- ===== HUD забега ===== -->
    <div id="hud" class="ingame">
      <div class="hud-left">
        <div id="lives" class="lives"></div>
        <div id="wave" class="wave">Волна 1</div>
      </div>
      <div id="dust" class="dust"><span id="dust-icon">✨</span><b id="dust-val">100</b></div>
      <button id="btn-pause" class="icon-btn" aria-label="Пауза">⏸️</button>
    </div>

    <div id="tut" class="tut hidden"></div>

    <!-- ===== Нижняя панель ===== -->
    <div id="panel" class="ingame">
      <div id="powers" class="powers"></div>
      <div class="panel-row">
        <button id="btn-speed" class="speed-btn">×1</button>
        <button id="btn-summon" class="summon-btn">
          <span class="summon-title">🎁 Достать игрушку</span>
          <span class="summon-cost"><span>✨</span><b id="summon-cost">10</b></span>
        </button>
      </div>
    </div>

    <!-- ===== Главное меню ===== -->
    <div id="menu" class="screen">
      <div class="menu-top">
        <div class="player">
          <div class="lvl-badge" id="m-level">1</div>
          <div class="xp"><div class="xp-label">Страж <span id="m-level2">1</span> ур.</div><div class="bar"><i id="m-xp"></i></div></div>
        </div>
        <div class="stars-pill"><span>⭐</span><b id="m-stars">0</b></div>
      </div>

      <div class="title-wrap">
        <div class="title-moon">🌙</div>
        <h1 class="title">Страж Снов</h1>
        <div class="subtitle">Защити сон малыша от кошмаров</div>
      </div>

      <div class="menu-cards">
        <button class="card-btn" id="m-free">
          <div class="cb-emoji">🎁</div>
          <div class="cb-text"><b>Бесплатный сундук</b><span id="m-free-t">Открыть!</span></div>
          <i class="dot hidden" id="m-free-dot"></i>
        </button>
        <div class="missions" id="m-missions"></div>
      </div>

      <div class="menu-bottom">
        <button class="play-btn" id="m-play">
          <span>ИГРАТЬ</span>
          <small id="m-best">Рекорд: —</small>
        </button>
        <div class="nav">
          <button class="nav-btn" id="m-coll">🧸<span>Игрушки</span><i class="dot hidden" id="m-coll-dot"></i></button>
          <button class="nav-btn" id="m-shop">🧰<span>Сундуки</span></button>
          <button class="nav-btn" id="m-set">⚙️<span>Настройки</span></button>
        </div>
      </div>
    </div>

    <!-- ===== Коллекция ===== -->
    <div id="coll" class="screen hidden">
      <div class="screen-head">
        <button class="back-btn" data-back>‹</button>
        <h2>Игрушки</h2>
        <div class="stars-pill"><span>⭐</span><b class="js-stars">0</b></div>
      </div>
      <div class="deck-label">Колода в бою <small>(5 игрушек)</small></div>
      <div id="deck" class="deck"></div>
      <div class="deck-label" id="coll-hint">Коллекция</div>
      <div id="collection" class="collection"></div>
    </div>

    <!-- ===== Магазин ===== -->
    <div id="shop" class="screen hidden">
      <div class="screen-head">
        <button class="back-btn" data-back>‹</button>
        <h2>Сундуки</h2>
        <div class="stars-pill"><span>⭐</span><b class="js-stars">0</b></div>
      </div>
      <div id="shop-list" class="shop-list"></div>
      <div class="shop-note">Звёзды ⭐ даются за каждую ночь, задания и уровни Стража.<br>Карты открывают новые игрушки и прокачивают старые.</div>
    </div>

    <!-- ===== Модалка ===== -->
    <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>

    <div id="toast" class="toast"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
